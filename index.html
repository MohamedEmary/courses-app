<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Courses App\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\n  environments:\n    - name: CoursesApp_dev\n      variables:\n        - name: BASE_URL\n          value: https://courses-app-zffh.onrender.com/api\nitems:\n  - info:\n      name: Auth\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        ## Auth\n\n        Registration and login. Both return an `accessToken` that a post-response\n        variable stores in `AUTH_TOKEN`; the rest of the collection uses it\n        automatically via the collection-level Bearer auth.\n      type: text/markdown\n    items:\n      - info:\n          name: Login\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{BASE_URL}}/auth/login'\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"test@emary.dev\",\n                \"password\": \"asd123\"\n              }\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.accessToken\n                method: jsonq\n              variable:\n                name: AUTH_TOKEN\n                scope: runtime\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.user.id\n                method: jsonq\n              variable:\n                name: USER_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Login\n\n          Logs in an existing user. Post-response variables store the returned\n          `accessToken` in `AUTH_TOKEN` and the user id in `USER_ID` (collection\n          scope), so every other request authenticates and targets the logged-in\n          user automatically.\n\n          - **Auth:** none\n          - **Expected:** `200` with `data.user` and `data.accessToken`\n      - info:\n          name: Register\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{BASE_URL}}/auth/register'\n          body:\n            type: multipart-form\n            data:\n              - name: name\n                type: text\n                value: Mohamed\n              - name: email\n                type: text\n                value: test@emary.dev\n              - name: password\n                type: text\n                value: asd123\n              - name: avatar\n                type: file\n                value:\n                  - Auth/avatar.png\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.accessToken\n                method: jsonq\n              variable:\n                name: AUTH_TOKEN\n                scope: runtime\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.user.id\n                method: jsonq\n              variable:\n                name: USER_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Register\n\n          Creates a new user. Post-response variables store the returned\n          `accessToken` in `AUTH_TOKEN` and the user id in `USER_ID` (collection\n          scope), so every other request authenticates and targets the logged-in\n          user automatically.\n\n          - **Auth:** none\n          - **Expected:** `201` with `data.user` and `data.accessToken`\n\n          ## Notes\n\n          - Registering an email that already exists returns an error.\n          - Emails ending in `@emary.dev` are assigned the `admin` role (required\n            for `Get All Courses` and `Delete Course`).\n  - info:\n      name: Courses\n      type: folder\n      seq: 2\n    request:\n      auth: inherit\n    docs:\n      content: |-\n        ## Courses\n\n        CRUD for courses. `Add Course` stores the new record's id in `COURSE_ID`,\n        which `Get` / `Update` / `Delete Course` then use.\n\n        - `Get All Courses` and `Delete Course` require the **admin** role.\n      type: text/markdown\n    items:\n      - info:\n          name: Get All Courses\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{BASE_URL}}/course'\n          params:\n            - name: limit\n              value: '3'\n              type: query\n            - name: page\n              value: '2'\n              type: query\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get All Courses\n\n          Lists courses with pagination.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Query params:** `limit` (1-20, default 3), `page` (default 1)\n          - **Expected:** `200` with `data.courses`\n      - info:\n          name: Get Course\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{BASE_URL}}/course/{{COURSE_ID}}'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get Course\n\n          Fetches a single course by id.\n\n          - **Auth:** Bearer token (run `Login` or `Register` first)\n          - **Path param:** `COURSE_ID`; auto-set by `Add Course`, or set manually\n          - **Expected:** `200` with `data.course { name, price }`\n      - info:\n          name: Add Course\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{BASE_URL}}/course'\n          body:\n            type: json\n            data: |-\n              {\n                \"name\": \"English\",\n                \"price\": 2000\n              }\n          auth: inherit\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.course._id\n                method: jsonq\n              variable:\n                name: COURSE_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Add Course\n\n          Creates a course. A post-response variable stores the new record's `_id`\n          in `COURSE_ID` (collection scope), so `Get`, `Update`, and `Delete Course`\n          target it automatically.\n\n          - **Auth:** Bearer token (run `Login` or `Register` first)\n          - **Body:** `name` (min 3 chars) and `price` (min 500)\n          - **Expected:** `201` with `data.course`\n      - info:\n          name: Update Course\n          type: http\n          seq: 4\n        http:\n          method: PATCH\n          url: '{{BASE_URL}}/course/{{COURSE_ID}}'\n          body:\n            type: json\n            data: |-\n              {\n                \"name\":\"TypeScript\",\n                \"price\": 12121\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Update Course\n\n          Updates `name` and/or `price` of the course referenced by `COURSE_ID`.\n\n          - **Auth:** Bearer token (run `Login` or `Register` first)\n          - **Expected:** `200` with `data.course` (updated)\n      - info:\n          name: Delete Course\n          type: http\n          seq: 5\n        http:\n          method: DELETE\n          url: '{{BASE_URL}}/course/{{COURSE_ID}}'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Delete Course\n\n          Deletes the course referenced by `COURSE_ID`.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Expected:** `200` with `data` null\n  - info:\n      name: Users\n      type: folder\n      seq: 3\n    request:\n      auth: inherit\n    docs:\n      content: |-\n        ## Users\n\n        User management. `Get Current User` stores the logged-in user's id in\n        `USER_ID`, which `Delete User` then uses.\n\n        - `Get All Users` and `Delete User` require the **admin** role.\n      type: text/markdown\n    items:\n      - info:\n          name: Get All Users\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{BASE_URL}}/users'\n          params:\n            - name: limit\n              value: '3'\n              type: query\n            - name: page\n              value: '1'\n              type: query\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get All Users\n\n          Lists users with pagination. Passwords are never returned.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Query params:** `limit` (1-20, default 3), `page` (default 1)\n          - **Expected:** `200` with `data.users`\n      - info:\n          name: Get Current User\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{BASE_URL}}/users/me'\n          auth: inherit\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.user.id\n                method: jsonq\n              variable:\n                name: USER_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get Current User\n\n          Returns the profile of the authenticated user. A post-response variable\n          stores the returned user id in `USER_ID` (collection scope), which\n          `Delete User` then uses.\n\n          - **Auth:** Bearer token\n          - **Expected:** `200` with `data.user`\n      - info:\n          name: Delete User\n          type: http\n          seq: 3\n        http:\n          method: DELETE\n          url: '{{BASE_URL}}/users/{{USER_ID}}'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Delete User\n\n          Deletes the user referenced by `USER_ID`.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Expected:** `200` with `data` null\nrequest:\n  auth:\n    type: bearer\n    token: '{{AUTH_TOKEN}}'\n  variables:\n    - name: AUTH_TOKEN\n      value: ''\n    - name: COURSE_ID\n      value: ''\n    - name: USER_ID\n      value: ''\ndocs:\n  content: |-\n    # Courses App API\n\n    REST API for managing courses: **Express + TypeScript + MongoDB**\n    (Mongoose) with **Zod** validation.\n\n    ## Base URL\n\n    - Default: `https://courses-app-zffh.onrender.com/api` (see `BASE_URL` environment variable)\n\n    ## Variables\n\n    | Variable     | Scope       | Description                                                    |\n    | ------------ | ----------- | -------------------------------------------------------------- |\n    | `BASE_URL`   | environment | API base URL (scheme + host + `/api`). Per-deployment config.  |\n    | `AUTH_TOKEN` | collection  | Access token. Auto-filled by `Login` / `Register`.             |\n    | `COURSE_ID`  | collection  | Id of the last created course. Auto-filled by `Add Course`.    |\n    | `USER_ID`    | collection  | Id of the logged-in user. Auto-filled by `Login` / `Register` / `Get Current User`. |\n\n    ## Authentication\n\n    - `POST /auth/register` and `POST /auth/login` return an `accessToken`.\n    - A post-response variable stores it in `AUTH_TOKEN`, so every request\n      authenticates automatically through the collection-level **Bearer** auth\n      (`Authorization: Bearer {{AUTH_TOKEN}}`).\n    - Access tokens expire after **15 minutes**. When expired, call\n      `POST /auth/refresh` (the server reads the refresh token from the\n      `httpOnly` cookie) to obtain a new `accessToken`.\n    - `POST /auth/logout` clears the refresh-token cookie.\n\n    ## Roles\n\n    - Emails ending in **`@emary.dev`** register as `admin`; all others as `user`.\n    - `admin` is required for `GET /course`, `DELETE /course/:id`, `GET /users`,\n      and `DELETE /users/:id`.\n\n    | Endpoint                | Auth   | Role  |\n    | ----------------------- | ------ | ----- |\n    | `POST /auth/register`   | -      | -     |\n    | `POST /auth/login`      | -      | -     |\n    | `POST /auth/refresh`    | cookie | -     |\n    | `POST /auth/logout`     | cookie | -     |\n    | `GET /course`           | Bearer | admin |\n    | `POST /course`          | Bearer | -     |\n    | `GET /course/:id`       | Bearer | -     |\n    | `PATCH /course/:id`     | Bearer | -     |\n    | `DELETE /course/:id`    | Bearer | admin |\n    | `GET /users`            | Bearer | admin |\n    | `GET /users/me`         | Bearer | -     |\n    | `DELETE /users/:id`     | Bearer | admin |\n\n    ## Response format (JSend)\n\n    All responses follow the [JSend](https://github.com/omniti-labs/jsend) spec:\n\n    ```json\n    { \"status\": \"success\", \"data\": { ... } }\n    ```\n\n    - `success` \u2192 `2xx`, with `data`\n    - `fail` \u2192 `4xx`, with `data: { message }`\n    - `error` \u2192 `5xx`, with an error object\n\n    ## Courses\n\n    | Field   | Type   | Rules                      |\n    | ------- | ------ | -------------------------- |\n    | `name`  | string | required, min 3 characters |\n    | `price` | number | required, min `500`        |\n\n    - `GET /course` paginates with `limit` (1-20, default `3`) and `page`\n      (default `1`).\n    - `:id` must be a 24-character hex ObjectId.\n\n    ## Users\n\n    - `GET /users` paginates with `limit` (1-20, default `3`) and `page`\n      (default `1`), and never returns passwords.\n    - `GET /users/me` returns the authenticated user's own profile.\n    - `:id` must be a 24-character hex ObjectId.\n\n    ## How to use this collection\n\n    1. Select the **CoursesApp_dev** environment (or create your own).\n    2. Run `Login` (existing user) or `Register` (new user); fills `AUTH_TOKEN` and `USER_ID`.\n    3. Run `Add Course`; fills `COURSE_ID`.\n    4. `Get`, `Update`, and `Delete Course` target `COURSE_ID` automatically.\n    5. Run `Get Current User`; fills `USER_ID`, used by `Delete User`.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-08-15T01:02:35.532Z'\n    exportedUsing: Bruno/4.0.0\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light',
            gitCollectionUrl: "git@github.com:MohamedEmary/courses-app.git"
        });
    </script>
