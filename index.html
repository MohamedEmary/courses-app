    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Courses App\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\n  environments:\n    - name: CoursesApp_dev\n      variables:\n        - name: BASE_URL\n          value: https://courses-app-zffh.onrender.com/api\nitems:\n  - info:\n      name: Auth\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        ## Auth\n\n        User authentication: registration, login, token refresh, and logout.\n        `Login`, `Register`, and `Refresh Token` store the returned `accessToken`\n        in `AUTH_TOKEN`; the rest of the collection uses it automatically via\n        collection-level Bearer auth.\n      type: text/markdown\n    items:\n      - info:\n          name: Login\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{BASE_URL}}/auth/login'\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"test@emary.dev\",\n                \"password\": \"asd123\"\n              }\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.accessToken\n                method: jsonq\n              variable:\n                name: AUTH_TOKEN\n                scope: runtime\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.user.id\n                method: jsonq\n              variable:\n                name: USER_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Login\n\n          Logs in an existing user. Post-response variables store the returned\n          `accessToken` in `AUTH_TOKEN` and the user id in `USER_ID` (collection\n          scope), so every other request authenticates and targets the logged-in\n          user automatically.\n\n          - **Auth:** none\n          - **Expected:** `200` with `data.user` and `data.accessToken`\n      - info:\n          name: Register\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{BASE_URL}}/auth/register'\n          body:\n            type: multipart-form\n            data:\n              - name: name\n                type: text\n                value: Mohamed\n              - name: email\n                type: text\n                value: test@emary.dev\n              - name: password\n                type: text\n                value: asd123\n              - name: avatar\n                type: file\n                value:\n                  - Auth/avatar.png\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.accessToken\n                method: jsonq\n              variable:\n                name: AUTH_TOKEN\n                scope: runtime\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.user.id\n                method: jsonq\n              variable:\n                name: USER_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Register\n\n          Creates a new user. Post-response variables store the returned\n          `accessToken` in `AUTH_TOKEN` and the user id in `USER_ID` (collection\n          scope), so every other request authenticates and targets the logged-in\n          user automatically.\n\n          - **Auth:** none\n          - **Expected:** `201` with `data.user` and `data.accessToken`\n\n          ## Notes\n\n          - Registering an email that already exists returns an error.\n          - Emails ending in `@emary.dev` are assigned the `admin` role (required\n            for `Get All Courses` and `Delete Course`).\n      - info:\n          name: Refresh Token\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{BASE_URL}}/auth/refresh'\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.accessToken\n                method: jsonq\n              variable:\n                name: AUTH_TOKEN\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Refresh Token\n\n          Exchanges the `refreshToken` cookie for a new `accessToken`. Post-response\n          variables store the returned `accessToken` in `AUTH_TOKEN` (collection\n          scope), so subsequent requests continue to authenticate.\n\n          - **Auth:** cookie (`refreshToken`, sent automatically by Bruno after `Login` or `Register`)\n          - **Expected:** `200` with `data.accessToken`\n      - info:\n          name: Logout\n          type: http\n          seq: 4\n        http:\n          method: POST\n          url: '{{BASE_URL}}/auth/logout'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Logout\n\n          Logs out the user by clearing the `refreshToken` cookie on path `/api/auth/refresh`.\n\n          - **Auth:** cookie (`refreshToken`)\n          - **Expected:** `200` with `data: null`\n  - info:\n      name: Courses\n      type: folder\n      seq: 2\n    request:\n      auth: inherit\n    docs:\n      content: |-\n        ## Courses\n\n        CRUD for courses. `Add Course` stores the new record's id in `COURSE_ID`,\n        which `Get` / `Update` / `Delete Course` then use.\n\n        - `Get All Courses` and `Delete Course` require the **admin** role.\n      type: text/markdown\n    items:\n      - info:\n          name: Get All Courses\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{BASE_URL}}/course'\n          params:\n            - name: limit\n              value: '3'\n              type: query\n            - name: page\n              value: '2'\n              type: query\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get All Courses\n\n          Lists courses with pagination.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Query params:** `limit` (1-20, default 3), `page` (default 1)\n          - **Expected:** `200` with `data.courses`\n      - info:\n          name: Get Course\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{BASE_URL}}/course/{{COURSE_ID}}'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get Course\n\n          Fetches a single course by id.\n\n          - **Auth:** Bearer token (run `Login` or `Register` first)\n          - **Path param:** `COURSE_ID`; auto-set by `Add Course`, or set manually\n          - **Expected:** `200` with `data.course { name, price }`\n      - info:\n          name: Add Course\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{BASE_URL}}/course'\n          body:\n            type: json\n            data: |-\n              {\n                \"name\": \"English\",\n                \"price\": 2000\n              }\n          auth: inherit\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.course._id\n                method: jsonq\n              variable:\n                name: COURSE_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Add Course\n\n          Creates a course. A post-response variable stores the new record's `_id`\n          in `COURSE_ID` (collection scope), so `Get`, `Update`, and `Delete Course`\n          target it automatically.\n\n          - **Auth:** Bearer token (run `Login` or `Register` first)\n          - **Body:** `name` (min 3 chars) and `price` (min 500)\n          - **Expected:** `201` with `data.course`\n      - info:\n          name: Update Course\n          type: http\n          seq: 4\n        http:\n          method: PATCH\n          url: '{{BASE_URL}}/course/{{COURSE_ID}}'\n          body:\n            type: json\n            data: |-\n              {\n                \"name\":\"TypeScript\",\n                \"price\": 12121\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Update Course\n\n          Updates `name` and/or `price` of the course referenced by `COURSE_ID`.\n\n          - **Auth:** Bearer token (run `Login` or `Register` first)\n          - **Expected:** `200` with `data.course` (updated)\n      - info:\n          name: Delete Course\n          type: http\n          seq: 5\n        http:\n          method: DELETE\n          url: '{{BASE_URL}}/course/{{COURSE_ID}}'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Delete Course\n\n          Deletes the course referenced by `COURSE_ID`.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Expected:** `200` with `data` null\n  - info:\n      name: Users\n      type: folder\n      seq: 3\n    request:\n      auth: inherit\n    docs:\n      content: |-\n        ## Users\n\n        User management. `Get Current User` stores the logged-in user's id in\n        `USER_ID`, which `Delete User` then uses.\n\n        - `Get All Users` and `Delete User` require the **admin** role.\n      type: text/markdown\n    items:\n      - info:\n          name: Get All Users\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{BASE_URL}}/users'\n          params:\n            - name: limit\n              value: '3'\n              type: query\n            - name: page\n              value: '1'\n              type: query\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get All Users\n\n          Lists users with pagination. Passwords are never returned.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Query params:** `limit` (1-20, default 3), `page` (default 1)\n          - **Expected:** `200` with `data.users`\n      - info:\n          name: Get Current User\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{BASE_URL}}/users/me'\n          auth: inherit\n        runtime:\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.data.user.id\n                method: jsonq\n              variable:\n                name: USER_ID\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Get Current User\n\n          Returns the profile of the authenticated user. A post-response variable\n          stores the returned user id in `USER_ID` (collection scope), which\n          `Delete User` then uses.\n\n          - **Auth:** Bearer token\n          - **Expected:** `200` with `data.user`\n      - info:\n          name: Delete User\n          type: http\n          seq: 3\n        http:\n          method: DELETE\n          url: '{{BASE_URL}}/users/{{USER_ID}}'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Delete User\n\n          Deletes the user referenced by `USER_ID`.\n\n          - **Auth:** Bearer token **+ admin role**\n          - **Expected:** `200` with `data` null\n          - An admin cannot delete their own account (`400`).\n  - info:\n      name: api-docs-fix\n      type: script\n    script: |\n      /**\n       * Workaround for a Bruno bug: fixes variable chaining in the Bruno API docs\n       * page (index.html). NOT part of the API (that lives in `server/`).\n       *\n       * VISITORS: ignore this file. It only patches the docs viewer inside the\n       * generated page; it never runs as part of the API.\n       *\n       * WHY: the docs viewer drops post-response variables (AUTH_TOKEN, USER_ID,\n       * COURSE_ID), so later requests lose auth. This script captures them from\n       * responses (fetch + XMLHttpRequest), stores them in localStorage, and\n       * re-injects them into later requests.\n       *\n       * HOW TO LINK: index.html must load it after the api-docs.js script tag, and\n       * the tag is dropped on every regeneration:\n       *   <script src=\"bruno/api-docs-fix.js\"><\/script>\n       *\n       * CONFIG: new captured value -> CAPTURE_RULES; new /:id route -> URL_ID_RULES;\n       * new deploy host -> API_URL_PATTERN (all below).\n       *\n       * DUAL MODE (single file, two jobs):\n       * - Browser: loaded by index.html (see HOW TO LINK) and patches the viewer.\n       * - Node: run `node bruno/api-docs-fix.js` to ensure index.html links this\n       *   file again after a regeneration. Used by .githooks/pre-commit and the\n       *   `pnpm docs:link` script.\n       */\n\n      (() => {\n        \"use strict\";\n\n        // ---- Node mode: re-link index.html after a regeneration ----\n        var fs = null;\n        try {\n          fs = require(\"node:fs\");\n        } catch (err) {\n          // browser context: require is not defined\n        }\n\n        if (fs) {\n          var nodePath = require(\"node:path\");\n          var indexPath = nodePath.join(__dirname, \"..\", \"index.html\");\n          var TAG = '<script src=\"bruno/api-docs-fix.js\"><\/script>';\n          var ANCHOR =\n            /([ \\t]*)(<script src=\"https:\\/\\/cdn\\.usebruno\\.com\\/api-docs\\/api-docs\\.js\"><\\/script>)/;\n\n          try {\n            var html = fs.readFileSync(indexPath, \"utf8\");\n            if (html.includes(TAG)) {\n              console.log(\"index.html already links api-docs-fix.js; nothing to do\");\n            } else {\n              var match = html.match(ANCHOR);\n              var next = match\n                ? html.replace(ANCHOR, function (_m, indent, tag) {\n                    return indent + tag + \"\\n\" + indent + TAG;\n                  })\n                : html.replace(\"<\/head>\", \"    \" + TAG + \"\\n<\/head>\");\n              fs.writeFileSync(indexPath, next);\n              console.log(\n                match\n                  ? \"linked api-docs-fix.js after the api-docs.js tag\"\n                  : \"api-docs.js tag not found; linked api-docs-fix.js before <\/head>\"\n              );\n            }\n          } catch (err) {\n            console.warn(\n              \"api-docs-fix: could not read \" + indexPath + \": \" + err.message\n            );\n          }\n          return;\n        }\n\n        // ---- browser mode: patch the docs viewer ----\n\n        var STORAGE_KEY = \"coursesApp.apiDocs.vars\";\n        var API_URL_PATTERN = /onrender\\.com\\/api|localhost:3000\\/api/;\n\n        /* Variables captured from JSend `data` responses (dot-path into `data`).\n           Append an entry here when a new endpoint returns a value to persist. */\n        var CAPTURE_RULES = [\n          { name: \"AUTH_TOKEN\", path: \"accessToken\" },\n          { name: \"USER_ID\", path: \"user.id\" },\n          { name: \"COURSE_ID\", path: \"course._id\" },\n        ];\n\n        /* Id-bearing URL segments. The viewer resolves {{VARIABLE}} to \"\" before\n           sending, leaving a trailing \"/segment/\". The script fills it from storage\n           and blocks the request when the variable is unset. Append an entry here\n           for every path param that depends on an earlier request. */\n        var URL_ID_RULES = [\n          { variable: \"COURSE_ID\", segment: \"course\" },\n          { variable: \"USER_ID\", segment: \"users\" },\n        ];\n\n        function loadVars() {\n          try {\n            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};\n          } catch (err) {\n            return {};\n          }\n        }\n\n        function saveVars(vars) {\n          try {\n            localStorage.setItem(STORAGE_KEY, JSON.stringify(vars));\n          } catch (err) {\n            /* localStorage unavailable; requests just run without auth */\n          }\n        }\n\n        /* Read a dot-path (e.g. \"user.id\") off an object. */\n        function getByPath(obj, path) {\n          return path.split(\".\").reduce(function (acc, key) {\n            return acc == null ? undefined : acc[key];\n          }, obj);\n        }\n\n        /* Capture configured variables out of any JSend response. */\n        function capture(json) {\n          if (!json || typeof json !== \"object\" || !json.data) return;\n          var vars = loadVars();\n          var changed = false;\n          CAPTURE_RULES.forEach(function (rule) {\n            var value = getByPath(json.data, rule.path);\n            if (value !== undefined && value !== null && value !== \"\") {\n              vars[rule.name] = value;\n              changed = true;\n            }\n          });\n          if (changed) saveVars(vars);\n        }\n\n        /* Precompile each rule's regexes once: the {{VARIABLE}} placeholder and the\n           trailing empty id segment (e.g. \".../course/\") the viewer leaves behind. */\n        URL_ID_RULES.forEach(function (rule) {\n          rule.placeholder = new RegExp(\"\\\\{\\\\{\" + rule.variable + \"\\\\}\\\\}\", \"g\");\n          rule.segmentEnd = new RegExp(\"/\" + rule.segment + \"/$\");\n        });\n\n        /* Interpolate id variables into a request URL and report a missing one.\n           Handles both forms: a raw {{VARIABLE}} placeholder, and the trailing\n           \"/segment/\" the viewer leaves when it resolves the placeholder to \"\".\n           Returns { url, missing }; missing is null when every id is present. */\n        function resolveUrl(url) {\n          var vars = loadVars();\n          var missing = null;\n          URL_ID_RULES.forEach(function (rule) {\n            var id = vars[rule.variable];\n            url = url.replace(rule.placeholder, id || \"\");\n            if (rule.segmentEnd.test(url)) {\n              if (id) {\n                url = url.replace(rule.segmentEnd, \"/\" + rule.segment + \"/\" + id);\n              } else {\n                missing = rule.variable + \" is not set\";\n              }\n            }\n          });\n          return { url: url, missing: missing };\n        }\n\n        /* JSend error body shared by both blocked-response paths. */\n        function missingBody(missing) {\n          return JSON.stringify({ status: \"error\", message: missing });\n        }\n\n        /* Builds a synthetic 400 JSON response so the viewer shows the message in\n           its response panel without sending a request or popping an alert. */\n        function missingResponse(missing) {\n          return new Response(missingBody(missing), {\n            status: 400,\n            headers: { \"Content-Type\": \"application/json\" },\n          });\n        }\n\n        /* Simulates a completed 400 response on an XMLHttpRequest so the viewer\n           shows the message without sending a request or popping an alert. */\n        function xhrRespondMissing(xhr, missing) {\n          var body = missingBody(missing);\n          var props = {\n            readyState: { value: 4, configurable: true },\n            status: { value: 400, configurable: true },\n            statusText: { value: \"Bad Request\", configurable: true },\n            responseText: { value: body, configurable: true },\n            response: { value: body, configurable: true },\n          };\n          Object.keys(props).forEach(function (key) {\n            try {\n              Object.defineProperty(xhr, key, props[key]);\n            } catch (err) {\n              /* some properties are non-configurable in some browsers; ignore */\n            }\n          });\n          try {\n            xhr.dispatchEvent(new Event(\"load\"));\n          } catch (err) {\n            // ignore\n          }\n        }\n\n        function authHeader() {\n          var vars = loadVars();\n          return vars.AUTH_TOKEN ? \"Bearer \" + vars.AUTH_TOKEN : null;\n        }\n\n        /* Override the header only when it is absent, empty, a bare \"Bearer\", or an\n           unresolved {{AUTH_TOKEN}} placeholder. Otherwise respect an existing\n           token. */\n        function needsAuthOverride(existing) {\n          if (!existing) return true;\n          existing = existing.trim();\n          return !existing || existing === \"Bearer\" || existing.indexOf(\"{{\") !== -1;\n        }\n\n        /* Parse response text and capture variables; ignores non-JSON bodies. */\n        function captureText(text) {\n          try {\n            capture(JSON.parse(text));\n          } catch (err) {\n            // not JSON; ignore\n          }\n        }\n\n        // ---- fetch ----\n        var origFetch = window.fetch;\n        if (origFetch) {\n          window.fetch = function (input, init) {\n            init = init || {};\n            var url = typeof input === \"string\" ? input : (input && input.url) || \"\";\n\n            if (API_URL_PATTERN.test(url)) {\n              var resolved = resolveUrl(url);\n              if (resolved.missing) {\n                console.warn(\"[api-docs-fix]\", resolved.missing);\n                return Promise.resolve(missingResponse(resolved.missing));\n              }\n              var headers = new Headers(init.headers);\n              var auth = authHeader();\n              if (auth && needsAuthOverride(headers.get(\"Authorization\"))) {\n                headers.set(\"Authorization\", auth);\n              }\n              init = Object.assign({}, init, {\n                headers: headers,\n                credentials: \"include\",\n              });\n              input =\n                typeof input === \"string\"\n                  ? resolved.url\n                  : new Request(resolved.url, input);\n            }\n\n            return origFetch.call(this, input, init).then(function (response) {\n              response\n                .clone()\n                .text()\n                .then(captureText)\n                .catch(function () {});\n              return response;\n            });\n          };\n        }\n\n        // ---- XMLHttpRequest ----\n        var origOpen = XMLHttpRequest.prototype.open;\n        var origSend = XMLHttpRequest.prototype.send;\n\n        XMLHttpRequest.prototype.open = function (method, url) {\n          var resolved = resolveUrl(url || \"\");\n          this.__fixUrl = resolved.ur `Login` / `Register` / `Refresh Token`.                |\n    | `COURSE_ID`  | collection  | Id of the last created course. Auto-filled by `Add Course`.                         |\n    | `USER_ID`    | collection  | Id of the logged-in user. Auto-filled by `Login` / `Register` / `Get Current User`. |\n\n    ## Authentication\n\n    - `POST /auth/register` and `POST /auth/login` return an `accessToken`.\n    - A post-response variable stores it in `AUTH_TOKEN`, so every request\n      authenticates automatically through the collection-level **Bearer** auth\n      (`Authorization: Bearer {{AUTH_TOKEN}}`).\n    - Access tokens expire after **15 minutes**. When expired, call\n      `POST /auth/refresh` (the server reads the refresh token from the\n      `httpOnly` cookie) to obtain a new `accessToken`.\n    - `POST /auth/logout` clears the refresh-token cookie.\n\n    ## Roles\n\n    - Emails ending in **`@emary.dev`** register as `admin`; all others as `user`.\n    - `admin` is required for `GET /course`, `DELETE /course/:id`, `GET /users`,\n      and `DELETE /users/:id`.\n\n    | Endpoint                | Auth   | Role  |\n    | ----------------------- | ------ | ----- |\n    | `POST /auth/register`   | -      | -     |\n    | `POST /auth/login`      | -      | -     |\n    | `POST /auth/refresh`    | cookie | -     |\n    | `POST /auth/logout`     | cookie | -     |\n    | `GET /course`           | Bearer | admin |\n    | `POST /course`          | Bearer | -     |\n    | `GET /course/:id`       | Bearer | -     |\n    | `PATCH /course/:id`     | Bearer | -     |\n    | `DELETE /course/:id`    | Bearer | admin |\n    | `GET /users`            | Bearer | admin |\n    | `GET /users/me`         | Bearer | -     |\n    | `DELETE /users/:id`     | Bearer | admin |\n\n    ## Response format (JSend)\n\n    All responses follow the [JSend](https://github.com/omniti-labs/jsend) spec:\n\n    ```json\n    { \"status\": \"success\", \"data\": { ... } }\n    ```\n\n    - `success`
