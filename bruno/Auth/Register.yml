info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Mohamed
      - name: email
        type: text
        value: test@emary.dev
      - name: password
        type: text
        value: asd123
      - name: avatar
        type: file
        value:
          - Auth/avatar.png

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.accessToken
        method: jsonq
      variable:
        name: AUTH_TOKEN
        scope: collection
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.user.id
        method: jsonq
      variable:
        name: USER_ID
        scope: collection

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Register

  Creates a new user. Post-response variables store the returned
  `accessToken` in `AUTH_TOKEN` and the user id in `USER_ID` (collection
  scope), so every other request authenticates and targets the logged-in
  user automatically.

  - **Auth:** none
  - **Expected:** `201` with `data.user` and `data.accessToken`

  ## Notes

  - Registering an email that already exists returns an error.
  - Emails ending in `@emary.dev` are assigned the `admin` role (required
    for `Get All Courses` and `Delete Course`).
