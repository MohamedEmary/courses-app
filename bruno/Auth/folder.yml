docs:
  content: |-
    ## Auth

    User authentication: registration, login, token refresh, and logout.
    `Login`, `Register`, and `Refresh Token` store the returned `accessToken`
    in `AUTH_TOKEN`; the rest of the collection uses it automatically via
    collection-level Bearer auth.
  type: text/markdown
