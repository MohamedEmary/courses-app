info:
  name: Get All Courses
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/course"
  params:
    - name: limit
      value: "3"
      type: query
    - name: page
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get All Courses

  Lists courses with pagination.

  - **Auth:** Bearer token **+ admin role**
  - **Query params:** `limit` (1–20, default 3), `page` (default 1)
  - **Expected:** `200` with `data.courses`
