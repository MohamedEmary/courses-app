info:
  name: Update Course
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{BASE_URL}}/course/{{COURSE_ID}}"
  body:
    type: json
    data: |-
      {
        "name":"TypeScript",
        "price": 12121
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Update Course

  Updates `name` and/or `price` of the course referenced by `COURSE_ID`.

  - **Auth:** Bearer token (run `Login` or `Register` first)
  - **Expected:** `200` with `data.course` (updated)
